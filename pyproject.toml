[project]
name = "personalcontext"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "sqlalchemy>=2,<3",
    "alembic>=1.14,<2",
    "pystray>=0.19,<1; sys_platform == 'win32'",
    "pywin32>=308; sys_platform == 'win32'",
    "pillow>=13,<14",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "pyinstaller>=6,<7; sys_platform == 'win32'",
    "detect-secrets==1.5.0",
    "unidiff==0.7.5",
    "mypy>=1.15,<2",
    "types-pywin32>=308",
    "jsonschema>=4.23,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personalcontext"]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
strict = true

[[tool.mypy.overrides]]
module = ["pystray", "pystray.*"]
ignore_missing_imports = true
