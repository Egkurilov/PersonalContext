name: checks
on: [push, pull_request]
jobs:
  checks:
    strategy:
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.13.10'
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - run: uv sync --locked
      - run: uv run python scripts/check_python.py
      - run: uv run python scripts/check_frontend.py
      - run: uv run python scripts/check_index.py
      - run: uv run ruff check src tests scripts
      - run: uv run mypy src/personalcontext
      - run: uv run python -m unittest discover -s tests -v
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - if: runner.os == 'Windows'
        run: uv run python scripts/smoke_fresh_clone.py
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          uv export --locked --format cyclonedx1.5 --output-file dist/sbom-python.json | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm sbom --prefix frontend --sbom-format cyclonedx --sbom-type application --package-lock-only | Set-Content -Encoding utf8NoBOM dist/sbom-frontend.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run python scripts/python_licenses.py
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: dependency-inventory
          path: |
            dist/sbom-python.json
            dist/sbom-frontend.json
            dist/python-licenses.json
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package.ps1

      - if: runner.os == 'Windows'
        run: uv run python scripts/smoke_frozen_repro.py
      - if: runner.os == 'Windows'
        run: uv run python scripts/smoke_frozen.py
      - if: runner.os == 'Windows'
        run: uv run python scripts/smoke_frozen_auth.py
      - if: runner.os == 'Windows'
        run: uv run python scripts/smoke_frozen_network.py
      - if: runner.os == 'Windows'
        run: uv run python scripts/smoke_frozen_websocket.py
      - if: runner.os == 'Windows'
        run: uv run python scripts/smoke_frozen_tls_settings.py
      - if: runner.os == 'Windows'
        run: uv run python scripts/smoke_frozen_restore.py

      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = & ./scripts/ensure_inno.ps1
          & $compiler /Qp installer/PersonalContext.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run python scripts/smoke_installer_repro.py $compiler
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - if: runner.os == 'Windows'
        timeout-minutes: 10
        run: uv run python scripts/smoke_installer.py
      - if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: pwsh
        run: |
          $compiler = & ./scripts/ensure_inno.ps1
          uv run python scripts/smoke_clone_repro.py $compiler
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: reproducibility-manifest
          path: dist/repro-manifest.json
          if-no-files-found: error
          retention-days: 7
